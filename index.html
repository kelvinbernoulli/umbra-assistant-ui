<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12141a" />
    <link rel="icon" type="image/svg+xml" href="/umbra-logo.svg" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('umbra-theme')
          const theme = saved === 'dark' || saved === 'light'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#12141a' : '#f7f4ee'
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta name="description" content="Umbra brings your messages, email, and calendar into one private, searchable memory." />
    <title>Umbra — Your personal operating system</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
